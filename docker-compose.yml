services:
  mongodb:
    image: mongo:7
    container_name: hmwssb-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: hmwssb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hmwssb-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      - MONGO_URI=mongodb://mongodb:27017/hmwssb
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-strong-secret-at-least-32-chars-long}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-Admin@123456}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: hmwssb-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongodb_data:
