name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  client-lint:
    name: Client Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint

  server-test:
    name: Server Tests
    runs-on: ubuntu-latest
    env:
      P12_SIGNING_PASSWORD: ${{ secrets.P12_SIGNING_PASSWORD || 'test-signing-password-for-ci' }}
      JWT_SECRET: test-secret-must-be-at-least-32-characters-long!!
      MONGO_URI: mongodb://localhost:27017/hmwssb-test
      NODE_ENV: test
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand(\"ping\").ok' | mongosh --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results
          path: server/tests/
          retention-days: 7

  client-build:
    name: Client Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit server dependencies
        working-directory: server
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Audit client dependencies
        working-directory: client
        run: npm audit --audit-level=high
        continue-on-error: true

  docker:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [server-test, client-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -t hmwssb-server:${{ github.sha }} ./server
      - name: Build client image
        run: docker build -t hmwssb-client:${{ github.sha }} ./client
      - name: Scan server image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hmwssb-server:${{ github.sha }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
      - name: Scan client image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hmwssb-client:${{ github.sha }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
